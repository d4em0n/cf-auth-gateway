# Schema-v1 JSON files remain available for deliberate migration.
schemaVersion: 2
id: fixture-app
hostname: app.fixture.test
epoch: 1
routes:
  - access: public
    methods:
      - GET
      - HEAD
    exact:
      - /
      - /login
  - access: public
    methods:
      - GET
      - HEAD
    prefix:
      - /assets/
  - access: public
    methods:
      - GET
    exact:
      - /api/version
  - access: auth_flow
    methods:
      - POST
    exact:
      - /auth/login
    rateLimit: true
    request:
      contentTypes:
        - application/json
      maxBodyBytes: 8192
      denyHeaders:
        - Next-Action
        - X-Middleware-Subrequest
      json:
        type: object
        required:
          - username
          - password
        additionalProperties: false
        properties:
          username:
            type: string
            maxLength: 320
          password:
            type: string
            maxLength: 2048
  - access: auth_flow
    methods:
      - POST
    exact:
      - /auth/refresh
    rateLimit: true
    request:
      maxBodyBytes: 0
  - access: auth_flow
    methods:
      - POST
    exact:
      - /auth/logout
    request:
      maxBodyBytes: 0
credentials:
  - id: access-token
    type: bearer
    validation:
      method: GET
      path: /auth/whoami
      jsonPath: user.id
  - id: browser-session
    type: cookie
    name: session
    validation:
      method: GET
      path: /auth/session
      jsonPath: user.id
retentionDays: 30
validationTimeoutMs: 3000
