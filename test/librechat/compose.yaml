name: cf-auth-librechat-qa
services:
  api:
    image: ${LIBRECHAT_IMAGE:-librechat-workspace-librechat:0.1.0}
    user: '1000:1000'
    env_file: ${GATEWAY_QA_DIR:?}/librechat.env
    ports: ['127.0.0.1:${GATEWAY_QA_PORT:-3096}:3080']
    volumes:
      - ${GATEWAY_QA_DIR}/librechat.env:/app/.env:ro
      - ${GATEWAY_QA_DIR}/librechat.yaml:/app/librechat.yaml:ro
      - ${GATEWAY_QA_DIR}/data:/app/data
      - ${GATEWAY_QA_DIR}/uploads:/app/uploads
      - ${GATEWAY_QA_DIR}/images:/app/client/public/images
      - ${GATEWAY_QA_DIR}/logs:/app/logs
      - ${GATEWAY_QA_DIR}/skill:/app/skill
    depends_on: [mongo]
    networks: [qa, provider]
    mem_limit: 2g
    cpus: 2
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  mongo:
    image: mongo@sha256:098862b1339f031900ca66cf8fef799e616d6324fa41b9a263f2ec899552c1ef
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    command: [mongod, --noauth, --wiredTigerCacheSizeGB, '0.25', --quiet]
    volumes:
      - ${GATEWAY_QA_DIR}/mongo-data:/data/db
      - ${GATEWAY_QA_DIR}/mongo-config:/data/configdb
    networks: [qa]
    mem_limit: 768m
networks:
  qa:
    ipam:
      config: [{ subnet: '${GATEWAY_QA_SUBNET:-10.190.86.0/24}' }]
  provider:
    external: true
    name: nginx-proxy-manager_default
